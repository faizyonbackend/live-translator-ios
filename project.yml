name: LiveTranslator
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "17.4"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.4"
    TARGETED_DEVICE_FAMILY: "1" # iPhone
    ENABLE_PREVIEWS: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  LiveTranslator:
    type: application
    platform: iOS
    deploymentTarget: "17.4"
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.livetranslator
        PRODUCT_NAME: "LiveTranslator"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_FILE: Sources/Info.plist
        GENERATE_INFOPLIST_KEY_UILaunchScreen_Generation: YES
